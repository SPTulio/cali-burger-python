name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: caliburger_test
          MYSQL_USER: caliburger
          MYSQL_PASSWORD: caliburger
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql+pymysql://caliburger:caliburger@127.0.0.1:3306/caliburger_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://caliburger:caliburger@127.0.0.1:3306/caliburger_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Permissão para o banco temporário do teste de importação
        run: mysql -h 127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON caliburger_legacy_test.* TO 'caliburger'@'%'"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app scripts
      - run: pytest -q

  frontend:
    name: Frontend (tsc, eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
