[project]
name = "caliburger-api"
version = "1.0.0"
description = "API do Cali Burger: pedidos, cardápio, estoque e relatórios de uma hamburgueria."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "email-validator>=2.2",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pymysql>=1.2",
    "cryptography>=43",
    "bcrypt>=5.0",
    "python-multipart>=0.0.18",
    "pillow>=12",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "C4", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003", # textos em português têm acentos e travessões
    "B008",                       # Depends() em parâmetros é o padrão do FastAPI
    "N818",                       # exceções de domínio com nomes curtos (NotFound, Forbidden)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]
