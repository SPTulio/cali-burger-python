# Cali Burger completo: MySQL + API (FastAPI) + frontend (Nginx).
#
#   cp .env.example .env        # ajuste as senhas
#   docker compose up -d --build
#   docker compose exec api python -m scripts.seed_demo   # opcional: dados de demonstração
#   Acesse http://localhost:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: caliburger
      MYSQL_USER: ${DB_USER:-caliburger}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: mysql+pymysql://${DB_USER:-caliburger}:${DB_PASSWORD}@db:3306/caliburger?charset=utf8mb4
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-10}
      TIMEZONE: ${TIMEZONE:-America/Sao_Paulo}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        VITE_SHOW_DEMO_ACCOUNTS: ${SHOW_DEMO_ACCOUNTS:-true}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  media:
